services:
  server:
    image: node:24-bookworm
    working_dir: /workspace/apps/server
    command: >
      sh -c "corepack enable pnpm && cd /workspace/apps/server && pnpm exec prisma generate --schema ./prisma/schema.prisma && pnpm exec prisma db push --schema ./prisma/schema.prisma && node prisma/seed.js && pnpm dev"
    environment:
      NODE_ENV: development
      DATABASE_URL: file:/workspace/apps/server/prisma/palmr.db
      API_BASE_URL: http://server:3333
      STORAGE_URL: http://localhost:9379
      ENABLE_S3: "false"
      DISABLE_FILESYSTEM_ENCRYPTION: "true"
      SECURE_SITE: "false"
    ports:
      - "3333:3333"
    volumes:
      - ./apps/server:/workspace/apps/server
      - ./package.json:/workspace/package.json
      - server_node_modules:/workspace/apps/server/node_modules
    restart: unless-stopped

  web:
    image: node:24-bookworm
    working_dir: /workspace/apps/web
    command: >
      sh -c "corepack enable pnpm && cd /workspace/apps/web && pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_DEFAULT_LANGUAGE: en-US
      API_BASE_URL: http://server:3333
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./package.json:/workspace/package.json
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_node_modules:
  web_node_modules:
