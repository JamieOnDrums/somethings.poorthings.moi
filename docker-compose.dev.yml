services:
  server:
    image: node:24-bookworm
    working_dir: /workspace/apps/server
    command: >
      sh -c "corepack enable pnpm && pnpm install && cd /workspace/apps/server && pnpm exec prisma generate --schema ./prisma/schema.prisma && pnpm exec prisma db push --schema ./prisma/schema.prisma && node prisma/seed.js && pnpm dev"
    environment:
      NODE_ENV: development
      DATABASE_URL: file:/workspace/apps/server/prisma/palmr.db
      API_BASE_URL: http://server:3333
      ENABLE_S3: "true"
      S3_ENDPOINT: minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: palmr-files
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_URL: http://localhost:9379
      DISABLE_FILESYSTEM_ENCRYPTION: "true"
      SECURE_SITE: "false"
    ports:
      - "3333:3333"
    volumes:
      - ./apps/server:/workspace/apps/server
      - ./package.json:/workspace/package.json
      - server_node_modules:/workspace/apps/server/node_modules
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    ports:
      - "9379:9000"
      - "9378:9001"
    volumes:
      - ./minio-data:/data
    restart: unless-stopped

