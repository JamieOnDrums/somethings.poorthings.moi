services:
  nginx-proxy:
    image: nginx:latest
    container_name: somethings-proxy
    ports:
      - "80:80" # The only port you need to open to the web
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - somethings
    restart: unless-stopped

  somethings:
    image: ghcr.io/jamieondrums/somethings-palmr:latest
    container_name: somethings
    expose:
      - "5487" # web interface docker only
      - "9379" # internal storage docker only
    environment:
      STORAGE_URL: "http://somethings.poorthings.moi/storage" # REQUIRED for internal storage: Full storage URL with protocol (e.g., https://syrg.palmr.com or http://192.168.1.100:9379). Not needed when ENABLE_S3=true.
    volumes:
      - palmr_data:/app/server
    restart: unless-stopped

volumes:
  palmr_data:
