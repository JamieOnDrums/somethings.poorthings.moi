events {}

http {
    client_max_body_size 10G; 

    server {
        listen 80;
        server_name somethings.poorthings.moi;

        # Global stream buffering settings
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;

        # 1. Main Palmr App
        location / {
            proxy_pass http://somethings:5487; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Palmr Internal Storage Route
        location /storage/ {
            # Trailing slash strips /storage/ before passing to port 9379
            proxy_pass http://somethings:9379/; 
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # S3 headers
            proxy_connect_timeout 300;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;
        }
    }
}