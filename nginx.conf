events {}

http {
    client_max_body_size 10G; 

    server {
        listen 80;
        server_name somethings.poorthings.moi;

        # Disable buffering so large uploads stream directly to MinIO
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
            proxy_pass http://somethings:5487; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /storage/ {
            # Trailing slash correctly strips /storage/ when passing to MinIO
            proxy_pass http://somethings:9379/; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Necessary headers for S3 signature verification
            proxy_connect_timeout 300;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;
        }
    }
}